    <style>
      :root {
        --font-display: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif;

        --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      }

      *, *::before, *::after {
        box-sizing: border-box;
      }

      html {
        background-color: #000000;
        color: #f8fafc;
        font-family: var(--font-sans);
        -webkit-tap-highlight-color: transparent;
        color-scheme: dark;
        max-width: 100%;
        overflow-x: hidden;
      }

      body {
        background-color: #000000;
        min-height: 100dvh;
        max-width: 100%;
        overflow-x: hidden;
        margin: 0;
      }

      h1, h2, h3, h4, .font-display {
        font-family: var(--font-display);
      }

      .font-mono, .tabular-nums {
        font-variant-numeric: tabular-nums;
      }

      /* Prevent iOS Safari intrinsic width blowout on <input type="time"> & <select> */
      input, select, button {
        max-width: 100%;
        min-width: 0;
        touch-action: manipulation;
      }

      input[type="time"] {
        -webkit-appearance: none;
        appearance: none;
        display: block;
        box-sizing: border-box;
        width: 100%;
        max-width: 100%;
        min-width: 0;
        overflow: hidden;
        text-align: left;
        line-height: 1.25;
      }

      input[type="time"]::-webkit-datetime-edit {
        display: inline-flex;
        align-items: center;
        min-width: 0;
        max-width: 100%;
        padding: 0;
      }

      input[type="time"]::-webkit-date-and-time-value {
        text-align: left;
        margin: 0;
      }

      /* Safe Area Utilities for Portrait & Landscape (Notch / Dynamic Island on Left/Right/Top) */
      .pt-safe {
        padding-top: env(safe-area-inset-top, 0px);
      }

      .pb-safe {
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }

      .px-safe {
        padding-left: max(1rem, env(safe-area-inset-left, 0px));
        padding-right: max(1rem, env(safe-area-inset-right, 0px));
      }

      @media (min-width: 640px) {
        .px-safe {
          padding-left: max(1.5rem, env(safe-area-inset-left, 0px));
          padding-right: max(1.5rem, env(safe-area-inset-right, 0px));
        }
      }

      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }

      ::-webkit-scrollbar-track {
        background: transparent;
      }

      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.14);
        border-radius: 9999px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.25);
      }

      @keyframes pin-shake {
        0%, 100% { transform: translateX(0); }
        20% { transform: translateX(-8px); }
        40% { transform: translateX(8px); }
        60% { transform: translateX(-6px); }
        80% { transform: translateX(6px); }
      }

      .animate-pin-shake {
        animation: pin-shake 0.36s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
      }

      @media (prefers-reduced-motion: reduce) {
        .animate-pin-shake {
          animation: none;
        }
      }
    </style>

      function useViewportLayout() {
        const getState = () => {
          if (typeof window === 'undefined') {
            return { width: 1024, height: 768, isLandscape: true, isCompactHeight: false };
          }
          const w = window.visualViewport ? Math.round(window.visualViewport.width) : window.innerWidth;
          const h = window.visualViewport ? Math.round(window.visualViewport.height) : window.innerHeight;
          return {
            width: w,
            height: h,
            isLandscape: w > h,
            isCompactHeight: h <= 540,
          };
        };

        const [viewport, setViewport] = useState(getState);

        useEffect(() => {
          let t1 = null;
          let t2 = null;
          const update = () => setViewport(getState());
          const handleOrientation = () => {
            update();
            window.clearTimeout(t1);
            window.clearTimeout(t2);
            // iOS Safari often updates innerWidth/innerHeight slightly after orientationchange fires
            t1 = window.setTimeout(update, 120);
            t2 = window.setTimeout(update, 320);
          };

          window.addEventListener('resize', update);
          window.addEventListener('orientationchange', handleOrientation);
          window.visualViewport?.addEventListener('resize', update);
          window.screen?.orientation?.addEventListener?.('change', handleOrientation);

          return () => {
            window.clearTimeout(t1);
            window.clearTimeout(t2);
            window.removeEventListener('resize', update);
            window.removeEventListener('orientationchange', handleOrientation);
            window.visualViewport?.removeEventListener('resize', update);
            window.screen?.orientation?.removeEventListener?.('change', handleOrientation);
          };
        }, []);

        return viewport;
      }

      /**
       * Mobile-friendly numeric input supporting German decimal comma (,) and dot (.) without snap-back while typing.
       */
      const NumericDraftInput = ({
        value,
        onCommit,
        min = 0,
        max = 9999,
        integer = false,
        className = '',
        id,
        'aria-label': ariaLabel,
      }) => {
        const formatVal = (v) => String(v);
        const [draft, setDraft] = useState(() => formatVal(value));
        const [focused, setFocused] = useState(false);

        useEffect(() => {
          if (!focused) {
            setDraft(formatVal(value));
          }
        }, [value, focused]);

        const parseVal = (raw) => {
          const normalized = String(raw).replace(',', '.').trim();
          if (normalized === '' || normalized === '.' || normalized === '-') return null;
          const parsed = integer ? parseInt(normalized, 10) : parseFloat(normalized);
          return Number.isFinite(parsed) ? parsed : null;
        };

        return (
          <input
            id={id}
            type="text"
            inputMode={integer ? 'numeric' : 'decimal'}
            pattern={integer ? '[0-9]*' : '[0-9.,]*'}
            autoComplete="off"
            autoCorrect="off"
            spellCheck={false}
            aria-label={ariaLabel}
            value={draft}
            onFocus={(e) => {
              setFocused(true);
              e.target.select?.();
            }}
            onChange={(e) => {
              const raw = e.target.value;
              const cleaned = integer
                ? raw.replace(/[^\d]/g, '')
                : raw.replace(/[^\d.,]/g, '');
              setDraft(cleaned);
              const num = parseVal(cleaned);
              if (num !== null && num >= min && num <= max) {
                onCommit(num);
              }
            }}
            onBlur={() => {
              setFocused(false);
              const num = parseVal(draft);
              if (num === null) {
                setDraft(formatVal(value));
              } else {
                const clamped = Math.max(min, Math.min(max, num));
                onCommit(clamped);
                setDraft(formatVal(clamped));
              }
            }}
            className={className}
          />
        );
      };

      function formatLapTime(seconds) {
        const safe = Math.max(10, seconds);
        const mins = Math.floor(safe / 60);
        const secs = safe - mins * 60;
        const wholeSecs = Math.floor(secs);
        const tenths = Math.round((secs - wholeSecs) * 10);
        const adjSecs = tenths === 10 ? wholeSecs + 1 : wholeSecs;
        const adjTenths = tenths === 10 ? 0 : tenths;
        return `${mins}:${String(adjSecs).padStart(2, '0')}.${adjTenths}`;
      }

      function formatDurationHMM(seconds) {
        const totalMins = Math.round(seconds / 60);
        const hrs = Math.floor(totalMins / 60);
        const mins = totalMins % 60;
        return `${hrs}:${String(mins).padStart(2, '0')} h`;
      }

      function formatRaceElapsed(seconds) {
        const totalMins = Math.floor(seconds / 60);
        const hrs = Math.floor(totalMins / 60);
        const mins = totalMins % 60;
        return `${String(hrs).padStart(2, '0')}:${String(mins).padStart(2, '0')}`;
      }

      function addSecondsToHHMM(startHHMM, addSeconds) {
        const parts = String(startHHMM || '14:00').split(':');
        const baseH = parseInt(parts[0] || '14', 10);
        const baseM = parseInt(parts[1] || '0', 10);
        const baseTotalMin = (isNaN(baseH) ? 14 : baseH) * 60 + (isNaN(baseM) ? 0 : baseM);
        const addedMin = Math.round(addSeconds / 60);
        const finalMin = (((baseTotalMin + addedMin) % 1440) + 1440) % 1440;
        const h = Math.floor(finalMin / 60);
        const m = finalMin % 60;
        return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
      }

      function calculateAutoLapTimeSec(track, car, weather) {
        const classMult = CLASS_LAPTIME_MULTIPLIER[car.carClass] || 1.0;
        return Number((track.hypercarDryLapSec * classMult * weather.lapTimeFactor).toFixed(1));
      }

      function calculateAutoFuelPerLap(track, car, weather) {
        return Number(
          (track.lengthKm * car.baseConsumptionLPerKm * track.fuelFactor * weather.fuelFactor).toFixed(2)
        );
      }

      function buildTireChangeStopMask(totalStops, tireQuota) {
        if (totalStops <= 0) return [];
        const availableChanges = Math.max(0, tireQuota - 1);
        if (availableChanges >= totalStops) return new Array(totalStops).fill(true);
        if (availableChanges === 0) return new Array(totalStops).fill(false);

        const mask = new Array(totalStops).fill(false);
        for (let k = 1; k <= availableChanges; k++) {
          const stopIdx = Math.min(
            totalStops - 1,
            Math.max(0, Math.round((k * totalStops) / (availableChanges + 1)) - 1)
          );
          if (!mask[stopIdx]) {
            mask[stopIdx] = true;
          } else {
            for (let offset = 1; offset < totalStops; offset++) {
              if (stopIdx + offset < totalStops && !mask[stopIdx + offset]) {
                mask[stopIdx + offset] = true;
                break;
              }
              if (stopIdx - offset >= 0 && !mask[stopIdx - offset]) {
                mask[stopIdx - offset] = true;
                break;
              }
            }
          }
        }
        return mask;
      }

      function assignDriversToStints(totalStints, activeDrivers, tireChangeMask) {
        const driverMap = new Map(TEAM_DRIVERS.map((d) => [d.id, d]));
        const enabledConfigs = activeDrivers.filter((d) => d.active);
        const raceEligible = enabledConfigs.filter((d) => d.priority !== 'quali_only');

        if (raceEligible.length === 0) {
          return Array.from({ length: totalStints }, () => ({
            driver: null,
            priority: null,
            isDoubleContinuation: false,
          }));
        }

        const assigned = new Array(totalStints).fill(null);

        const starter =
          raceEligible.find((d) => d.priority === 'quali_start') ||
          raceEligible.find((d) => d.priority === 'start_stint1') ||
          raceEligible[0];
        assigned[0] = starter;

        if (totalStints > 1) {
          const finisher =
            raceEligible.find((d) => d.priority === 'final_stint' && d.id !== starter.id) ||
            raceEligible.find((d) => d.priority === 'final_stint');
          if (finisher) {
            assigned[totalStints - 1] = finisher;
          }
        }

        const stintCounts = new Map();
        raceEligible.forEach((d) => stintCounts.set(d.id, 0));
        assigned.forEach((d) => {
          if (d) stintCounts.set(d.id, (stintCounts.get(d.id) || 0) + 1);
        });

        if (totalStints > 2 && starter.priority === 'double_stint' && assigned[1] === null) {
          assigned[1] = starter;
          stintCounts.set(starter.id, (stintCounts.get(starter.id) || 0) + 1);
        }

        for (let i = 0; i < totalStints; i++) {
          if (assigned[i] !== null) continue;

          const prevDriver = i > 0 ? assigned[i - 1] : null;
          const prevWasAlreadyDouble = i >= 2 && assigned[i - 1]?.id === assigned[i - 2]?.id;

          if (
            prevDriver &&
            prevDriver.priority === 'double_stint' &&
            !prevWasAlreadyDouble &&
            i < totalStints - 1
          ) {
            assigned[i] = prevDriver;
            stintCounts.set(prevDriver.id, (stintCounts.get(prevDriver.id) || 0) + 1);
            continue;
          }

          const nextDriver = i + 1 < totalStints ? assigned[i + 1] : null;
          const prevStopNoTires = i > 0 && !tireChangeMask[i - 1];
          const candidates = [...raceEligible].sort((a, b) => {
            const countDiff = (stintCounts.get(a.id) || 0) - (stintCounts.get(b.id) || 0);
            if (countDiff !== 0) return countDiff;
            const aDoubleBonus = prevStopNoTires && a.priority === 'double_stint' && a.id === prevDriver?.id ? -1 : 0;
            const bDoubleBonus = prevStopNoTires && b.priority === 'double_stint' && b.id === prevDriver?.id ? -1 : 0;
            const aPenalty = (a.id === prevDriver?.id ? 2 : 0) + (a.id === nextDriver?.id ? 1 : 0) + aDoubleBonus;
            const bPenalty = (b.id === prevDriver?.id ? 2 : 0) + (b.id === nextDriver?.id ? 1 : 0) + bDoubleBonus;
            return aPenalty - bPenalty;
          });

          const chosen = candidates[0];
          assigned[i] = chosen;
          stintCounts.set(chosen.id, (stintCounts.get(chosen.id) || 0) + 1);
        }

        return assigned.map((cfg, idx) => ({
          driver: cfg ? driverMap.get(cfg.id) || null : null,
          priority: cfg ? cfg.priority : null,
          isDoubleContinuation: idx > 0 && cfg !== null && assigned[idx - 1]?.id === cfg.id,
        }));
      }

      function calculateStrategy(config, track, car, weather, durationMinutes) {
        const warnings = [];
        const autoFuelPerLapL = calculateAutoFuelPerLap(track, car, weather);
        const autoLapTimeSec = calculateAutoLapTimeSec(track, car, weather);

        const effectiveFuelPerLapL =
          config.manualFuelPerLapL !== null && config.manualFuelPerLapL > 0.1
            ? config.manualFuelPerLapL
            : autoFuelPerLapL;

        const effectiveTankVolumeL =
          config.manualTankVolumeL !== null && config.manualTankVolumeL >= 10
            ? config.manualTankVolumeL
            : car.tankCapacityL;

        const effectiveLapTimeSec =
          config.manualLapTimeSec !== null && config.manualLapTimeSec >= 30
            ? config.manualLapTimeSec
            : autoLapTimeSec;

        const usableTankL = Math.max(effectiveFuelPerLapL, effectiveTankVolumeL - config.fuelReserveL);
        const maxLapsPerStint = Math.max(1, Math.floor(usableTankL / effectiveFuelPerLapL));
        const stintDurationMaxSec = maxLapsPerStint * effectiveLapTimeSec;
        const totalDurationSec = Math.max(60, durationMinutes * 60);

        const isQuali = config.sessionType === 'Qualifying';
        const isTraining = config.sessionType === 'Training';

        let estimatedTotalLaps = Math.max(1, Math.ceil(totalDurationSec / effectiveLapTimeSec));
        if (!isQuali && !isTraining && estimatedTotalLaps > maxLapsPerStint) {
          const approxStops = Math.max(0, Math.ceil(estimatedTotalLaps / maxLapsPerStint) - 1);
          const avgPitLoss = config.pitStopFuelTimeSec + config.pitStopTireTimeSec * 0.6;
          const netDrivingSec = Math.max(effectiveLapTimeSec, totalDurationSec - approxStops * avgPitLoss);
          estimatedTotalLaps = Math.max(1, Math.ceil(netDrivingSec / effectiveLapTimeSec));
        }

        let totalStints = isQuali
          ? Math.max(1, Math.min(2, Math.ceil(durationMinutes / 15)))
          : Math.max(1, Math.ceil(estimatedTotalLaps / maxLapsPerStint));

        if (isQuali) {
          const qualiRunLaps = Math.min(maxLapsPerStint, Math.max(3, Math.floor(estimatedTotalLaps / totalStints)));
          estimatedTotalLaps = qualiRunLaps * totalStints;
        }

        const totalPitStops = Math.max(0, totalStints - 1);
        const tireChangeMask = buildTireChangeStopMask(totalPitStops, config.tireQuota);

        const driverMap = new Map(TEAM_DRIVERS.map((d) => [d.id, d]));
        const activeDriverConfigs = config.drivers.filter((d) => d.active);
        const qualiDrivers = activeDriverConfigs
          .filter((d) => d.priority === 'quali_only' || d.priority === 'quali_start')
          .map((d) => driverMap.get(d.id))
          .filter(Boolean);

        if (activeDriverConfigs.length === 0) {
          warnings.push('Kein aktiver Fahrer ausgewählt. Wähle mindestens einen Fahrer für die Einsatzplanung.');
        } else if (!isQuali && activeDriverConfigs.every((d) => d.priority === 'quali_only')) {
          warnings.push('Alle aktiven Fahrer stehen auf „Nur Qualifying“. Weise mindestens einem Fahrer eine Rennrolle zu.');
        }

        if (totalStints > config.tireQuota && !isQuali) {
          warnings.push(
            `Reifenkontingent (${config.tireQuota} Sätze) ist kleiner als ${totalStints} Stints – Double-Stints ohne Reifenwechsel automatisch eingeplant.`
          );
        }

        const assignedDrivers = isQuali
          ? Array.from({ length: totalStints }, (_, idx) => {
              const qDriver =
                qualiDrivers[idx % Math.max(1, qualiDrivers.length)] ||
                (activeDriverConfigs[0] ? driverMap.get(activeDriverConfigs[0].id) || null : null);
              return {
                driver: qDriver,
                priority: qDriver ? 'quali_only' : null,
                isDoubleContinuation: false,
              };
            })
          : assignDriversToStints(totalStints, config.drivers, tireChangeMask);

        const stints = [];
        let currentLap = 1;
        let elapsedSec = 0;
        let currentTireSet = 1;
        const maxTireSets = Math.max(1, config.tireQuota);
        let remainingLaps = estimatedTotalLaps;

        for (let i = 0; i < totalStints; i++) {
          const isLast = i === totalStints - 1;
          const lapsThisStint = isQuali
            ? Math.max(1, Math.round(estimatedTotalLaps / totalStints))
            : isLast
            ? Math.max(1, remainingLaps)
            : Math.min(maxLapsPerStint, Math.max(1, remainingLaps - (totalStints - 1 - i)));

          remainingLaps = Math.max(0, remainingLaps - lapsThisStint);
          const startLap = currentLap;
          const endLap = currentLap + lapsThisStint - 1;
          currentLap = endLap + 1;

          const fuelNeededForThisStint = Number((lapsThisStint * effectiveFuelPerLapL + config.fuelReserveL).toFixed(1));
          const fuelStartL = Math.min(effectiveTankVolumeL, fuelNeededForThisStint);
          const fuelUsedL = Number((lapsThisStint * effectiveFuelPerLapL).toFixed(1));

          const driveTimeSec = lapsThisStint * effectiveLapTimeSec;
          const stintStartSec = elapsedSec;
          const stintEndSec = elapsedSec + driveTimeSec;
          const tireSetDuringStint = currentTireSet;

          let refuelLitersAtStop = null;
          let tireAction = 'Ziel';
          let tiresRemainingAfterStop = Math.max(0, maxTireSets - currentTireSet);

          if (!isLast) {
            const nextLaps =
              i + 1 === totalStints - 1
                ? Math.max(1, remainingLaps)
                : Math.min(maxLapsPerStint, Math.max(1, remainingLaps - (totalStints - 2 - i)));

            const targetNextFuel = Math.min(
              effectiveTankVolumeL,
              Number((nextLaps * effectiveFuelPerLapL + config.fuelReserveL).toFixed(1))
            );
            const residualInTank = Math.max(0, fuelStartL - fuelUsedL);
            refuelLitersAtStop = Number(Math.max(0, targetNextFuel - residualInTank).toFixed(1));

            const changeTires = tireChangeMask[i];
            if (changeTires && currentTireSet < maxTireSets) {
              currentTireSet += 1;
              tireAction = 'Reifenwechsel';
            } else {
              tireAction = 'Double-Stint (Nur Tanken)';
            }
            tiresRemainingAfterStop = Math.max(0, maxTireSets - currentTireSet);

            const pitDurationSec = config.pitStopFuelTimeSec + (changeTires ? config.pitStopTireTimeSec : 0);
            elapsedSec = stintEndSec + pitDurationSec;
          } else {
            elapsedSec = stintEndSec;
          }

          stints.push({
            stintNumber: i + 1,
            driver: assignedDrivers[i]?.driver || null,
            driverPriority: assignedDrivers[i]?.priority || null,
            isDoubleStintContinuation: assignedDrivers[i]?.isDoubleContinuation || false,
            startLap,
            endLap,
            lapsInStint: lapsThisStint,
            pitStopLap: isLast ? null : endLap,
            raceTimeStartSec: stintStartSec,
            raceTimeEndSec: stintEndSec,
            wallClockStart: addSecondsToHHMM(config.startTimeHHMM, stintStartSec),
            wallClockEnd: addSecondsToHHMM(config.startTimeHHMM, stintEndSec),
            fuelStartL,
            fuelUsedL,
            refuelLitersAtStop,
            tireAction: i === 0 && totalStints === 1 ? 'Start-Satz' : tireAction,
            tireSetNumber: tireSetDuringStint,
            tiresRemainingAfterStop,
            stintDurationSec: driveTimeSec,
          });
        }

        const driverSummaryMap = new Map();
        activeDriverConfigs.forEach((cfg) => {
          const profile = driverMap.get(cfg.id);
          if (!profile) return;
          driverSummaryMap.set(cfg.id, {
            driver: profile,
            priority: cfg.priority,
            stintCount: 0,
            totalLaps: 0,
            totalDriveTimeSec: 0,
            sharePercent: 0,
            isQualiSpecialist: cfg.priority === 'quali_only' || cfg.priority === 'quali_start',
          });
        });

        let totalDriveSecAll = 0;
        stints.forEach((s) => {
          totalDriveSecAll += s.stintDurationSec;
          if (s.driver) {
            const entry = driverSummaryMap.get(s.driver.id);
            if (entry) {
              entry.stintCount += 1;
              entry.totalLaps += s.lapsInStint;
              entry.totalDriveTimeSec += s.stintDurationSec;
            }
          }
        });

        const driverSummaries = Array.from(driverSummaryMap.values()).map((sum) => ({
          ...sum,
          sharePercent: totalDriveSecAll > 0 ? Math.round((sum.totalDriveTimeSec / totalDriveSecAll) * 100) : 0,
        }));

        const totalFuelNeededL = Number((estimatedTotalLaps * effectiveFuelPerLapL + config.fuelReserveL).toFixed(1));
        const tireSetsUsed = Math.min(maxTireSets, currentTireSet);

        return {
          autoFuelPerLapL,
          effectiveFuelPerLapL,
          effectiveTankVolumeL,
          autoLapTimeSec,
          effectiveLapTimeSec,
          maxLapsPerStint,
          stintDurationMaxSec,
          totalDurationSec,
          estimatedTotalLaps,
          totalFuelNeededL,
          totalPitStops,
          tireSetsUsed,
          tireSetsRemaining: Math.max(0, maxTireSets - tireSetsUsed),
          stints,
          driverSummaries,
          qualiDrivers,
          warnings,
        };
      }

      const PinLockScreen = ({ onUnlock, isCompactLandscape }) => {
        const [pin, setPin] = useState('');
        const [errorShake, setErrorShake] = useState(false);
        const [errorMsg, setErrorMsg] = useState(null);
        const [now, setNow] = useState(() => new Date());

        useEffect(() => {
          const timer = window.setInterval(() => setNow(new Date()), 15000);
          return () => window.clearInterval(timer);
        }, []);

        const handleDigit = useCallback(
          (digit) => {
            if (errorShake) return;
            setErrorMsg(null);
            setPin((prev) => {
              if (prev.length >= 4) return prev;
              const next = prev + digit;
              if (next.length === 4) {
                if (next === VALID_PIN) {
                  window.setTimeout(() => onUnlock(), 140);
                } else {
                  setErrorShake(true);
                  setErrorMsg('Falsche PIN. Bitte erneut versuchen.');
                  window.setTimeout(() => {
                    setPin('');
                    setErrorShake(false);
                  }, 420);
                }
              }
              return next;
            });
          },
          [errorShake, onUnlock]
        );

        const handleBackspace = useCallback(() => {
          setErrorMsg(null);
          setPin((prev) => prev.slice(0, -1));
        }, []);

        useEffect(() => {
          const onKeyDown = (e) => {
            if (e.key >= '0' && e.key <= '9') {
              handleDigit(e.key);
            } else if (e.key === 'Backspace') {
              handleBackspace();
            }

          window.addEventListener('keydown', onKeyDown);
          return () => window.removeEventListener('keydown', onKeyDown);

              </div>
              <div className={`font-mono font-semibold tracking-tight tabular-nums text-white ${isCompactLandscape ? 'text-4xl' : 'text-5xl sm:text-6xl'}`}>
                {timeFormatted}
              </div>
              <div className="mt-1 text-xs sm:text-sm text-slate-300 capitalize">{dateFormatted}</div>
              <div className={isCompactLandscape ? 'mt-3' : 'mt-6'}>
                <FavelaLogo size={isCompactLandscape ? 'md' : 'lg'} />
              </div>

              <div className={`flex flex-col items-center ${isCompactLandscape ? 'mt-3' : 'mt-6'}`}>
                <p className="text-xs sm:text-sm font-medium text-slate-200 mb-3">Team-PIN eingeben</p>
                <div
                  className={`flex items-center gap-4 ${errorShake ? 'animate-pin-shake' : ''}`}

                  aria-label={`${pin.length} von 4 Ziffern eingegeben`}
                >
                  {[0, 1, 2, 3].map((index) => {
                    const filled = index < pin.length;
                    return (
                      <div
                        key={index}
                        className={`w-3.5 h-3.5 sm:w-4 sm:h-4 rounded-full border transition-all duration-150 ${
                          filled
                            ? 'bg-[#009739] border-[#009739] scale-110 shadow-[0_0_12px_rgba(0,151,57,0.55)]'
                            : 'bg-transparent border-white/40'
                        }`}
                      />
                    );
                  })}
                </div>
                <div className="h-5 mt-2 text-xs text-rose-400 font-medium">{errorMsg || ''}</div>
              </div>
            </div>

            <div className={`w-full ${isCompactLandscape ? 'max-w-[230px] py-2' : 'max-w-[290px] pb-6 sm:pb-10'}`}>
              <div className={`grid grid-cols-3 ${isCompactLandscape ? 'gap-x-4 gap-y-2.5' : 'gap-x-5 gap-y-4'} justify-items-center`}>

                    onClick={() => handleDigit(item.digit)}
                    className={`${keySizeClass} rounded-full bg-white/[0.1] hover:bg-white/[0.18] active:bg-white/[0.28] active:scale-95 backdrop-blur-xl border border-white/[0.08] flex flex-col items-center justify-center transition-all duration-150 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#fedd00]`}
                  >
                    <span className={`font-mono font-medium leading-none text-white ${isCompactLandscape ? 'text-xl' : 'text-2xl'}`}>{item.digit}</span>

                </button>
              </div>
              {!isCompactLandscape && (
                <p className="mt-4 text-center text-xs text-slate-500">Lokale Offline-Sitzung · PIN 1234</p>
              )}
            </div>
            </div>
          </div>
        );
      };

          const ua = window.navigator.userAgent.toLowerCase();
          setIsIOS(/iphone|ipad|ipod/.test(ua));

          const onBeforeInstall = (e) => {
            e.preventDefault();
            setDeferredPrompt(e);

          const onInstalled = () => {
            setIsInstalled(true);
            setDeferredPrompt(null);
          };
          window.addEventListener('beforeinstallprompt', onBeforeInstall);
          window.addEventListener('appinstalled', onInstalled);
          return () => {
            window.removeEventListener('beforeinstallprompt', onBeforeInstall);
            window.removeEventListener('appinstalled', onInstalled);
          };
        }, []);

        if (isInstalled) return null;

        if (deferredPrompt) {
          return (
            <button
              type="button"
              onClick={async () => {
                await deferredPrompt.prompt();

                if (outcome === 'accepted') {
                  setIsInstalled(true);
                  setDeferredPrompt(null);
                }
              }}

                    <ol className="mt-4 space-y-3 text-sm text-slate-300">

                  <div style={{ fontSize: '13px', color: '#fedd00', fontFamily: '"JetBrains Mono", monospace' }}>

                                )}

                            ) : (
                              <span style={{ color: '#64748b' }}>Nicht zugewiesen</span>
                            )}
                          </td>
                          <td style={{ padding: '12px 14px', fontFamily: '"JetBrains Mono", monospace', color: '#e2e8f0' }}>
                            <div>{row.wallClockStart} – {row.wallClockEnd}</div>
                            <div style={{ fontSize: '11px', color: '#94a3b8' }}>
                              Rennzeit {formatRaceElapsed(row.raceTimeStartSec)} – {formatRaceElapsed(row.raceTimeEndSec)}
                            </div>
                          </td>
                          <td
                            style={{
                              padding: '12px 14px',
                              textAlign: 'right',
                              fontFamily: '"JetBrains Mono", monospace',
                              fontWeight: 700,
                              color: row.pitStopLap !== null ? '#fedd00' : '#00c44b',

                              textAlign: 'right',

                              color: row.refuelLitersAtStop !== null ? '#ffffff' : '#64748b',
                            }}

                          </td>

                      );

              <div style={{ marginTop: '18px', display: 'flex', justifyContent: 'space-between', fontSize: '12px', color: '#64748b' }}>

                <span>Offline-Strategieblatt · Alle Angaben inkl. {config.fuelReserveL} L Sicherheitsreserve</span>
              </div>
            </div>
          </div>
        );
      };

      const ExportSnapshotModal = ({ imageUrl, imageBlob, fileName, sessionType, onClose }) => {
        const [canShareFile, setCanShareFile] = useState(false);

        useEffect(() => {
          setCanShareFile(
            typeof navigator !== 'undefined' &&
              typeof navigator.share === 'function' &&
              typeof navigator.canShare === 'function'
          );
        }, []);

        if (!imageUrl) return null;

        const handleDownload = () => {
          const link = document.createElement('a');
          link.href = imageUrl;
          link.download = fileName;
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
        };

        const handleNativeShare = async () => {
          try {
            const blob = imageBlob || (await (await fetch(imageUrl)).blob());
            const file = new File([blob], fileName, { type: 'image/jpeg' });
            if (navigator.canShare && navigator.canShare({ files: [file] })) {
              await navigator.share({
                title: `Favela Motorsport ${sessionType}-Strategie`,
                text: 'LMU Stint- & Strategie-Plan',
                files: [file],
              });
            } else {
              handleDownload();
            }
          } catch {}
        };

        return (
          <div
            className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/80 backdrop-blur-md p-3 sm:p-6 pt-safe pb-safe"
            role="dialog"
            aria-modal="true"
            aria-label="Strategie JPG Vorschau"
          >
            <div className="w-full max-w-4xl max-h-[92dvh] flex flex-col rounded-3xl bg-[#0e1618] border border-white/15 shadow-2xl overflow-hidden">
              <div className="flex items-center justify-between px-5 py-4 border-b border-white/10">
                <div className="min-w-0 pr-3">
                  <h3 className="text-base sm:text-lg font-bold text-white">Strategie-Snapshot (JPG)</h3>
                  <p className="text-xs text-slate-400">
                    Auf iPhone/iPad lange auf das Bild drücken zum Sichern in Fotos, oder direkt teilen.
                  </p>
                </div>
                <button
                  type="button"
                  onClick={onClose}
                  aria-label="Vorschau schließen"
                  className="min-h-[44px] min-w-[44px] shrink-0 flex items-center justify-center rounded-2xl bg-white/[0.06] hover:bg-white/[0.12] text-slate-300 hover:text-white transition-colors"
                >
                  <XIcon className="w-5 h-5" />
                </button>
              </div>

              <div className="flex-1 overflow-auto p-4 sm:p-6 bg-black/60 flex items-start justify-center">
                <img
                  src={imageUrl}
                  alt="Favela Motorsport LMU Strategie Übersicht"
                  className="w-full max-w-[900px] h-auto rounded-xl border border-white/10 shadow-xl"
                />
              </div>

              <div className="flex flex-wrap items-center justify-end gap-3 px-5 py-4 border-t border-white/10 bg-[#111a1c]">
                {canShareFile && (
                  <button
                    type="button"
                    onClick={handleNativeShare}
                    className="min-h-[44px] inline-flex items-center gap-2 rounded-2xl bg-[#162b2d] hover:bg-[#1e3a3d] border border-white/10 px-4 py-2.5 text-sm font-semibold text-white transition-colors"
                  >
                    <ShareIcon className="w-4 h-4 text-[#fedd00]" />
                    <span>Teilen / In Fotos sichern</span>
                  </button>
                )}
                <button
                  type="button"
                  onClick={handleDownload}
                  className="min-h-[44px] inline-flex items-center gap-2 rounded-2xl bg-[#009739] hover:bg-[#00ae42] px-5 py-2.5 text-sm font-semibold text-white transition-colors"
                >
                  <DownloadIcon className="w-4 h-4" />
                  <span>Als JPG herunterladen</span>
                </button>
              </div>
            </div>
          </div>
        );
      };

      // =========================================================================
      // 8. HAUPTANWENDUNG (LOCALSTORAGE, ORIENTATION-ADAPTIVE LAYOUT & UI)
      // =========================================================================

      const STORAGE_UNLOCKED_KEY = 'favela_lmu_unlocked_v1';
      const STORAGE_CONFIG_KEY = 'favela_lmu_config_v1';

      const DEFAULT_CONFIG = {
        trackId: 'lemans',
        carId: 'ferrari-499p',
        sessionType: 'Race',
        durationPresetId: '6h',
        customDurationMinutes: 180,
        startTimeHHMM: '14:00',
        weatherId: 'dry',
        tireQuota: 6,
        fuelReserveL: 2.0,
        pitStopFuelTimeSec: 28,
        pitStopTireTimeSec: 12,
        manualFuelPerLapL: null,
        manualTankVolumeL: null,
        manualLapTimeSec: null,
        drivers: [
          { id: '10', active: true, priority: 'quali_start' },
          { id: '17', active: true, priority: 'standard' },
          { id: '31', active: true, priority: 'final_stint' },
          { id: '45', active: false, priority: 'standard' },
          { id: '79', active: false, priority: 'standard' },
          { id: '212', active: false, priority: 'standard' },
        ],
      };

      function loadSavedUnlocked() {
        try {
          return localStorage.getItem(STORAGE_UNLOCKED_KEY) === 'true';
        } catch {
          return false;
        }
      }

      function loadSavedConfig() {
        try {
          const raw = localStorage.getItem(STORAGE_CONFIG_KEY);
          if (!raw) return DEFAULT_CONFIG;
          const parsed = JSON.parse(raw);
          const mergedDrivers = TEAM_DRIVERS.map((td) => {
            const existing = parsed.drivers?.find((d) => d.id === td.id);
            if (existing) return existing;
            const def = DEFAULT_CONFIG.drivers.find((d) => d.id === td.id);
            return def || { id: td.id, active: false, priority: 'standard' };
          });
          return { ...DEFAULT_CONFIG, ...parsed, drivers: mergedDrivers };
        } catch {
          return DEFAULT_CONFIG;
        }
      }

      function App() {
        const viewport = useViewportLayout();
        const [isUnlocked, setIsUnlocked] = useState(loadSavedUnlocked);
        const [config, setConfig] = useState(loadSavedConfig);
        const [classFilter, setClassFilter] = useState('Alle');
        const [isExporting, setIsExporting] = useState(false);
        const [exportError, setExportError] = useState(null);
        const [previewImageUrl, setPreviewImageUrl] = useState(null);
        const [previewBlob, setPreviewBlob] = useState(null);
        const [exportFileName, setExportFileName] = useState('favela-lmu-strategie.jpg');

        const exportCaptureRef = useRef(null);

        useEffect(() => {
          try {
            localStorage.setItem(STORAGE_UNLOCKED_KEY, isUnlocked ? 'true' : 'false');
          } catch {}
        }, [isUnlocked]);

        useEffect(() => {
          try {
            localStorage.setItem(STORAGE_CONFIG_KEY, JSON.stringify(config));
          } catch {}
        }, [config]);

        useEffect(() => {
          return () => {
            if (previewImageUrl && previewImageUrl.startsWith('blob:')) {
              URL.revokeObjectURL(previewImageUrl);
            }
          };
        }, [previewImageUrl]);

        const selectedTrack = useMemo(
          () => LMU_TRACKS.find((t) => t.id === config.trackId) || LMU_TRACKS[0],
          [config.trackId]
        );
        const selectedCar = useMemo(
          () => LMU_CARS.find((c) => c.id === config.carId) || LMU_CARS[0],
          [config.carId]
        );
        const selectedWeather = useMemo(
          () => WEATHER_CONDITIONS.find((w) => w.id === config.weatherId) || WEATHER_CONDITIONS[0],
          [config.weatherId]
        );

        const durationMinutes = useMemo(() => {
          if (config.durationPresetId === 'custom') {
            return Math.max(5, Math.min(2880, config.customDurationMinutes || 60));
          }
          return DURATION_PRESETS.find((p) => p.id === config.durationPresetId)?.minutes || 360;
        }, [config.durationPresetId, config.customDurationMinutes]);

        const strategy = useMemo(
          () => calculateStrategy(config, selectedTrack, selectedCar, selectedWeather, durationMinutes),
          [config, selectedTrack, selectedCar, selectedWeather, durationMinutes]
        );

        const handleTrackChange = (trackId) => {
          setConfig((prev) => ({ ...prev, trackId, manualFuelPerLapL: null, manualLapTimeSec: null }));
        };

        const handleCarChange = (carId) => {
          setConfig((prev) => ({
            ...prev,
            carId,
            manualFuelPerLapL: null,
            manualTankVolumeL: null,
            manualLapTimeSec: null,
          }));
        };

        const handleWeatherChange = (weatherId) => {
          setConfig((prev) => ({ ...prev, weatherId, manualFuelPerLapL: null, manualLapTimeSec: null }));
        };

        const toggleDriverActive = (driverId) => {
          setConfig((prev) => ({
            ...prev,
            drivers: prev.drivers.map((d) => (d.id === driverId ? { ...d, active: !d.active } : d)),
          }));
        };

        const updateDriverPriority = (driverId, priority) => {
          setConfig((prev) => ({
            ...prev,
            drivers: prev.drivers.map((d) => (d.id === driverId ? { ...d, priority } : d)),
          }));
        };

        const handleExportJPG = async () => {
          if (!exportCaptureRef.current || isExporting) return;
          setIsExporting(true);
          setExportError(null);
          try {
            await new Promise((resolve) => window.requestAnimationFrame(() => resolve(true)));
            const canvas = await window.html2canvas(exportCaptureRef.current, {
              scale: 2,
              backgroundColor: '#050809',
              useCORS: true,
              logging: false,
              onclone: (clonedDoc) => {
                const styles = clonedDoc.querySelectorAll('style, link[rel="stylesheet"]');
                styles.forEach((node) => node.remove());
              },
            });

            const fileName = `favela-lmu-${selectedTrack.id}-${config.sessionType.toLowerCase()}.jpg`;
            setExportFileName(fileName);

            const blob = await new Promise((resolve) =>
              canvas.toBlob((b) => resolve(b), 'image/jpeg', 0.95)
            );

            if (blob) {
              const objectUrl = URL.createObjectURL(blob);
              setPreviewBlob(blob);
              setPreviewImageUrl(objectUrl);

              const link = document.createElement('a');
              link.href = objectUrl;
              link.download = fileName;
              document.body.appendChild(link);
              link.click();
              document.body.removeChild(link);
            } else {
              const dataUrl = canvas.toDataURL('image/jpeg', 0.95);
              setPreviewBlob(null);
              setPreviewImageUrl(dataUrl);
            }
          } catch {
            setExportError('JPG-Export konnte nicht erstellt werden. Bitte erneut versuchen.');
          } finally {
            setIsExporting(false);
          }
        };

        if (!isUnlocked) {
          return (
            <PinLockScreen
              onUnlock={() => setIsUnlocked(true)}
              isCompactLandscape={viewport.isLandscape && viewport.isCompactHeight}
            />
          );
        }

        const activeDriversCount = config.drivers.filter((d) => d.active).length;
        const filteredCarsByClass = CAR_CLASSES.filter((cls) => classFilter === 'Alle' || cls === classFilter);
        const displayLapSec = strategy.effectiveLapTimeSec;
        const lapMins = Math.floor(displayLapSec / 60);
        const lapSecs = Number((displayLapSec - lapMins * 60).toFixed(1));

        const updateLapTimeMinSec = (newMin, newSec) => {
          const clampedMin = Math.max(0, Math.min(10, newMin));
          const clampedSec = Math.max(0, Math.min(59.9, newSec));
          const total = Number((clampedMin * 60 + clampedSec).toFixed(1));
          if (total >= 30) {
            setConfig((prev) => ({ ...prev, manualLapTimeSec: total }));
          }
        };

        // Adaptive layout mode when rotating Phone or iPad
        const showTableView = viewport.width >= 720 || (viewport.isLandscape && viewport.width >= 640);
        const isTwoColWorkspace = viewport.width >= 960 || (viewport.isLandscape && viewport.width >= 820);

        return (
          <div
            className="min-h-dvh w-full max-w-full overflow-x-hidden bg-black text-slate-100 pb-14 pb-safe"
            style={{
              backgroundImage:
                'radial-gradient(ellipse 80% 45% at 50% 0%, rgba(22, 43, 45, 0.55) 0%, rgba(0, 0, 0, 1) 70%)',
            }}
          >
            {/* Header with Safe-Area Support for Portrait & Landscape Notches */}
            <header className="sticky top-0 z-30 pt-safe bg-black/80 backdrop-blur-xl border-b border-white/[0.08]">
              <div className="max-w-7xl mx-auto px-safe h-14 sm:h-16 flex items-center justify-between gap-2 sm:gap-6">
                <a
                  href="#top"
                  className="flex items-center gap-2.5 sm:gap-3 min-w-0 shrink focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#fedd00] rounded-xl"
                >
                  <FavelaLogo size="sm" />
                  <span className="font-display text-sm sm:text-lg font-bold tracking-tight text-white truncate">
                    Favela Motorsport
                  </span>
                </a>

                <nav className="hidden md:flex items-center gap-6 lg:gap-7 text-sm font-medium text-slate-400 shrink-0">
                  <a href="#konfiguration" className="hover:text-white transition-colors whitespace-nowrap shrink-0">
                    Setup &amp; Verbrauch
                  </a>
                  <a href="#fahrer" className="hover:text-white transition-colors whitespace-nowrap shrink-0">
                    Fahrer &amp; Rollen
                  </a>
                  <a href="#stint-plan" className="hover:text-white transition-colors whitespace-nowrap shrink-0">
                    Stint-Tabelle
                  </a>
                </nav>

                <div className="flex items-center gap-2 shrink-0">
                  <PWAInstallButton />
                  <button
                    type="button"
                    onClick={() => setIsUnlocked(false)}
                    className="min-h-[44px] inline-flex items-center gap-1.5 rounded-xl bg-white/[0.07] hover:bg-white/[0.14] border border-white/[0.09] px-3 sm:px-3.5 py-2 text-xs font-semibold text-white transition-colors whitespace-nowrap shrink-0 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#fedd00]"
                  >
                    <LockIcon className="w-3.5 h-3.5 text-[#fedd00]" />
                    <span>Sperren</span>
                  </button>
                </div>
              </div>
            </header>

            <main id="top" className="max-w-7xl mx-auto px-safe pt-5 sm:pt-8 space-y-6 sm:space-y-8 overflow-x-hidden">
              {/* Session & Export Toolbar */}
              <section className="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4 sm:gap-5 pb-5 sm:pb-6 border-b border-white/[0.08]">
                <div className="min-w-0">
                  <div className="flex flex-wrap items-center gap-2 text-xs text-slate-400 mb-1.5">
                    <span>Le Mans Ultimate</span>
                    <span aria-hidden="true">·</span>
                    <span>{selectedTrack.shortName}</span>
                    <span aria-hidden="true">·</span>
                    <span className="truncate">{selectedCar.name}</span>
                  </div>
                  <h1 className="font-display text-2xl sm:text-3xl font-bold tracking-tight text-white">
                    Stint- &amp; Strategie-Rechner
                  </h1>
                </div>

                <div className="flex flex-col sm:flex-row items-stretch sm:items-center gap-3">
                  <div className="grid grid-cols-3 p-1 rounded-2xl bg-[#111a1c] border border-white/[0.08]" role="group" aria-label="Session-Typ">
                    {['Training', 'Qualifying', 'Race'].map((sType) => {
                      const isActive = config.sessionType === sType;
                      return (
                        <button
                          key={sType}
                          type="button"
                          onClick={() => setConfig((prev) => ({ ...prev, sessionType: sType }))}
                          className={`min-h-[44px] px-3 sm:px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold transition-all duration-150 whitespace-nowrap ${
                            isActive ? 'bg-[#009739] text-white shadow-sm' : 'text-slate-400 hover:text-white'
                          }`}
                        >
                          {sType}
                        </button>
                      );
                    })}
                  </div>

                  <button
                    type="button"
                    onClick={handleExportJPG}
                    disabled={isExporting}
                    className="min-h-[48px] inline-flex items-center justify-center gap-2.5 rounded-2xl bg-[#fedd00] hover:bg-[#ffe433] active:scale-[0.98] disabled:opacity-60 px-4 sm:px-5 py-2.5 text-sm font-bold text-black transition-all duration-150 whitespace-nowrap shrink-0 shadow-lg shadow-[#fedd00]/10 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white"
                  >
                    <CameraIcon className="w-4 h-4 shrink-0" />
                    <span>{isExporting ? 'Erstelle JPG...' : 'Strategie als Bild (JPG) speichern'}</span>
                  </button>
                </div>
              </section>

              {exportError && (
                <div className="rounded-2xl bg-rose-950/60 border border-rose-500/30 px-4 py-3 text-sm text-rose-200">
                  {exportError}
                </div>
              )}

              {/* KPI-Leiste: 2 cols in Portrait Phone, 4 cols in Landscape Phone / iPad / Desktop */}
              <section className={`grid gap-3 sm:gap-4 ${viewport.isLandscape || viewport.width >= 640 ? 'grid-cols-4' : 'grid-cols-2'}`}>
                <div className="min-w-0 rounded-2xl bg-[#111a1c] border border-white/[0.08] p-3.5 sm:p-5">

                              <span
                                className={`w-7 h-7 rounded-xl flex items-center justify-center border transition-colors shrink-0 ${
                                  isActive ? 'bg-[#009739] border-[#009739] text-white' : 'bg-transparent border-white/25 text-transparent'
                                }`}
                              >
                                <CheckIcon className="w-4 h-4" />
                              </span>
                              <div className="min-w-0">
                                <div className="text-sm sm:text-base font-semibold text-white truncate">
                                  <span className="font-mono text-[#fedd00] mr-1.5">{driver.number}</span>
                                  {driver.name}
                                </div>
                                {isActive && summary ? (
                                  <div className="text-xs text-slate-400 font-mono tabular-nums mt-0.5 truncate">
                                    {summary.priority === 'quali_only'
                                      ? 'Nur Qualifying-Einsatz'
                                      : `${summary.stintCount} Stints · ${summary.totalLaps} Rd · ${formatDurationHMM(summary.totalDriveTimeSec)} (${summary.sharePercent}%)`}
                                  </div>
                                ) : (
                                  <div className="text-xs text-slate-500 mt-0.5">Tippen zum Aktivieren</div>
                                )}
                              </div>
                            </div>
                          </button>

                          {isActive && (
                            <div className="px-4 pb-3.5 pt-1 border-t border-white/[0.06] flex items-center justify-between gap-2.5 min-w-0">
                              <label htmlFor={`priority-${driver.id}`} className="text-xs font-medium text-slate-400 shrink-0">
                                Priorität:
                              </label>
                              <select
                                id={`priority-${driver.id}`}
                                value={priority}
                                onChange={(e) => updateDriverPriority(driver.id, e.target.value)}
                                className="w-full min-w-0 min-h-[44px] rounded-xl bg-black/60 border border-white/10 px-3 py-1.5 text-base sm:text-sm font-medium text-white truncate focus:outline-none focus:ring-2 focus:ring-[#fedd00]"
                              >
                                {PRIORITY_OPTIONS.map((opt) => (
                                  <option key={opt.value} value={opt.value} className="bg-[#0e1618] text-white">
                                    {opt.label}
                                  </option>
                                ))}
                              </select>
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                </section>
              </div>

              {/* Warnungen */}
              {strategy.warnings.length > 0 && (
                <div className="rounded-2xl bg-[#1e1a0c] border border-[#fedd00]/35 px-4 py-3.5 flex items-start gap-3">
                  <ShieldAlertIcon className="w-5 h-5 text-[#fedd00] shrink-0 mt-0.5" />
                  <div className="space-y-1 text-sm text-amber-100">
                    {strategy.warnings.map((w, idx) => (
                      <p key={idx}>{w}</p>
                    ))}
                  </div>
                </div>
              )}

              {/* Stint- & Boxenstopp-Tabelle (automatically switches between Table and Touch Cards on orientation/width) */}
              <section id="stint-plan" className="w-full min-w-0 rounded-3xl bg-[#0e1618] border border-white/[0.08] overflow-hidden">
                <div className="px-4 sm:px-6 py-4 sm:py-5 bg-[#162b2d]/60 border-b border-white/[0.08] flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
                  <div className="min-w-0">
                    <div className="flex items-center gap-2">
                      <TimerIcon className="w-5 h-5 text-[#009739] shrink-0" />
                      <h2 className="font-display text-lg sm:text-xl font-bold text-white truncate">
                        Stint- &amp; Boxenstopp-Strategie
                      </h2>
                    </div>
                    <p className="text-xs sm:text-sm text-slate-300 mt-1 tabular-nums">
                      {config.sessionType} · {strategy.stints.length} Stints · {strategy.totalPitStops} Boxenstopps · Reifensätze:{' '}
                      {strategy.tireSetsUsed}/{config.tireQuota}
                    </p>
                  </div>

                  <button
                    type="button"
                    onClick={handleExportJPG}
                    disabled={isExporting}
                    className="min-h-[44px] inline-flex items-center justify-center gap-2 rounded-2xl bg-[#009739] hover:bg-[#00ae42] active:scale-[0.98] px-4 py-2 text-xs sm:text-sm font-semibold text-white transition-all whitespace-nowrap shrink-0"
                  >
                    <CameraIcon className="w-4 h-4" />
                    <span>{isExporting ? 'Export läuft...' : 'Als JPG speichern'}</span>
                  </button>
                </div>

                {showTableView ? (
                  <div className="w-full overflow-x-auto">
                    <table className="w-full border-collapse text-left">
                      <thead>
                        <tr className="bg-black/40 border-b border-white/[0.08] text-xs font-semibold text-slate-400">
                          <th className="py-3.5 px-4 sm:px-5">Stint-Nr.</th>
                          <th className="py-3.5 px-3 sm:px-4">Fahrer</th>
                          <th className="py-3.5 px-3 sm:px-4">Uhrzeit / Rennzeit</th>
                          <th className="py-3.5 px-3 sm:px-4 text-right">Boxenstopp</th>
                          <th className="py-3.5 px-3 sm:px-4 text-right">Nachzutanken</th>
                          <th className="py-3.5 px-4 sm:px-5">Reifen &amp; Rest</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-white/[0.06]">
                        {strategy.stints.map((row) => {
                          const isTireChange = row.tireAction === 'Reifenwechsel';
                          const isDouble = row.tireAction === 'Double-Stint (Nur Tanken)';
                          return (
                            <tr key={row.stintNumber} className="hover:bg-white/[0.03] transition-colors">
                              <td className="py-3.5 px-4 sm:px-5 font-mono tabular-nums whitespace-nowrap">
                                <div className="text-sm font-bold text-white">Stint {row.stintNumber}</div>
                                <div className="text-xs text-slate-400">
                                  {row.lapsInStint} Rd ({row.startLap}–{row.endLap})
                                </div>
                              </td>
                              <td className="py-3.5 px-3 sm:px-4">
                                {row.driver ? (
                                  <div>
                                    <div className="text-sm font-semibold text-white whitespace-nowrap">
                                      <span className="font-mono text-[#fedd00] mr-1.5">{row.driver.number}</span>
                                      {row.driver.name}
                                    </div>
                                    {row.isDoubleStintContinuation && (
                                      <div className="text-xs text-[#00c44b] font-medium">Double-Stint Fahrer</div>
                                    )}
                                  </div>
                                ) : (
                                  <span className="text-xs text-slate-500">Kein Fahrer aktiv</span>
                                )}
                              </td>
                              <td className="py-3.5 px-3 sm:px-4 font-mono tabular-nums whitespace-nowrap">
                                <div className="text-sm font-medium text-slate-100">
                                  {row.wallClockStart} – {row.wallClockEnd}
                                </div>
                                <div className="text-xs text-slate-400">
                                  Rennzeit {formatRaceElapsed(row.raceTimeStartSec)} – {formatRaceElapsed(row.raceTimeEndSec)}
                                </div>
                              </td>
                              <td className="py-3.5 px-3 sm:px-4 text-right font-mono tabular-nums whitespace-nowrap">
                                {row.pitStopLap !== null ? (
                                  <span className="text-sm font-bold text-[#fedd00]">Ende Rd. {row.pitStopLap}</span>
                                ) : (
                                  <span className="text-sm font-semibold text-[#00c44b]">Ziel</span>
                                )}
                              </td>
                              <td className="py-3.5 px-3 sm:px-4 text-right font-mono tabular-nums whitespace-nowrap">
                                {row.refuelLitersAtStop !== null ? (
                                  <span className="text-sm font-bold text-white">+{row.refuelLitersAtStop.toFixed(1)} L</span>
                                ) : (
                                  <span className="text-sm text-slate-500">—</span>
                                )}
                              </td>
                              <td className="py-3.5 px-4 sm:px-5 whitespace-nowrap">
                                <div
                                  className={`text-sm font-semibold ${
                                    isTireChange ? 'text-[#00c44b]' : isDouble ? 'text-[#fedd00]' : 'text-slate-300'
                                  }`}
                                >
                                  {row.tireAction}
                                </div>
                                <div className="text-xs text-slate-400 font-mono tabular-nums">
                                  Satz {row.tireSetNumber} · Restkontingent: {row.tiresRemainingAfterStop}
                                </div>
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                ) : (
                  <div className="divide-y divide-white/[0.07]">
                    {strategy.stints.map((row) => {
                      const isTireChange = row.tireAction === 'Reifenwechsel';
                      const isDouble = row.tireAction === 'Double-Stint (Nur Tanken)';
                      return (
                        <div key={row.stintNumber} className="p-4 space-y-2.5">
                          <div className="flex items-center justify-between gap-2">
                            <div className="font-mono text-sm font-bold text-white tabular-nums">
                              Stint {row.stintNumber} · {row.lapsInStint} Rd ({row.startLap}–{row.endLap})
                            </div>
                            <div className="font-mono text-xs text-slate-300 tabular-nums">
                              {row.wallClockStart} – {row.wallClockEnd}
                            </div>
                          </div>

                          <div className="flex items-center justify-between gap-2">
                            <div className="text-sm font-semibold text-white truncate">
                              {row.driver ? (
                                <>
                                  <span className="font-mono text-[#fedd00] mr-1">{row.driver.number}</span>
                                  {row.driver.name}
                                </>
                              ) : (
                                <span className="text-slate-500">Kein Fahrer</span>
                              )}
                            </div>
                            <div className="font-mono text-xs text-slate-400 tabular-nums shrink-0">
                              Rennzeit {formatRaceElapsed(row.raceTimeStartSec)}
                            </div>
                          </div>

                          <div className="grid grid-cols-3 gap-2 pt-1.5 text-xs">
                            <div>
                              <div className="text-slate-400">Boxenstopp</div>
                              <div className="font-mono font-bold text-[#fedd00] tabular-nums">
                                {row.pitStopLap !== null ? `Rd. ${row.pitStopLap}` : 'Ziel'}
                              </div>
                            </div>
                            <div>
                              <div className="text-slate-400">Nachtanken</div>
                              <div className="font-mono font-bold text-white tabular-nums">
                                {row.refuelLitersAtStop !== null ? `+${row.refuelLitersAtStop.toFixed(1)} L` : '—'}
                              </div>
                            </div>
                            <div>
                              <div className="text-slate-400">Reifen (Rest {row.tiresRemainingAfterStop})</div>
                              <div
                                className={`font-semibold truncate ${
                                  isTireChange ? 'text-[#00c44b]' : isDouble ? 'text-[#fedd00]' : 'text-slate-300'
                                }`}
                              >
                                {isDouble ? 'Nur Tanken' : row.tireAction}
                              </div>
                            </div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}
              </section>
            </main>

            <footer className="max-w-7xl mx-auto px-safe pt-8 pb-4 flex flex-col sm:flex-row items-center justify-between gap-2 text-xs text-slate-500">
              <span>Favela Motorsport · Le Mans Ultimate Strategie-Rechner</span>
              <span>Alle Einstellungen lokal im Browser gespeichert · Eigenständige Single-File-HTML-App</span>
            </footer>

            <ExportSnapshotView
              captureRef={exportCaptureRef}
              config={config}
              track={selectedTrack}
              car={selectedCar}
              weather={selectedWeather}
              durationMinutes={durationMinutes}
              result={strategy}
            />

            <ExportSnapshotModal
              imageUrl={previewImageUrl}
              imageBlob={previewBlob}
              fileName={exportFileName}
              sessionType={config.sessionType}
              onClose={() => setPreviewImageUrl(null)}
            />

            <OfflineIndicator />
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
